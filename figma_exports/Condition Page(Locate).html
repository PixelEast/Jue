<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Condition Logic | Deterministic Noir</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#3b3b3b",
              "inverse-surface": "#303030",
              "surface-container": "#eeeeee",
              "on-tertiary-container": "#ffffff",
              "secondary-fixed-dim": "#ababab",
              "on-tertiary-fixed-variant": "#e2e2e4",
              "background": "#f9f9f9",
              "on-tertiary": "#e2e2e4",
              "primary-container": "#003099",
              "on-primary-fixed": "#ffffff",
              "error-container": "#ffdad6",
              "surface-container-low": "#f3f3f3",
              "on-secondary-fixed": "#1b1b1b",
              "error": "#ba1a1a",
              "surface-container-high": "#e8e8e8",
              "on-secondary-container": "#1b1b1b",
              "on-primary-container": "#ffffff",
              "on-secondary": "#ffffff",
              "secondary": "#5e5e5e",
              "on-error-container": "#410002",
              "surface-bright": "#f9f9f9",
              "on-primary": "#dce1ff",
              "on-primary-fixed-variant": "#dce1ff",
              "tertiary-fixed": "#5d5e60",
              "on-background": "#1b1b1b",
              "surface-container-highest": "#e2e2e2",
              "surface-tint": "#004ee8",
              "tertiary-container": "#737576",
              "secondary-container": "#d4d4d4",
              "inverse-on-surface": "#f1f1f1",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#004ee8",
              "primary-fixed-dim": "#003ab3",
              "tertiary": "#3a3c3d",
              "outline": "#777777",
              "surface-variant": "#e2e2e2",
              "primary": "#000000",
              "on-surface-variant": "#474747",
              "on-tertiary-fixed": "#ffffff",
              "secondary-fixed": "#c6c6c6",
              "on-error": "#ffffff",
              "surface": "#f9f9f9",
              "outline-variant": "#c6c6c6",
              "tertiary-fixed-dim": "#454749",
              "surface-dim": "#dadada",
              "inverse-primary": "#b6c4ff",
              "on-surface": "#1b1b1b"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "2xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .ease-spring {
        transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      /* Minimalist Map Styling */
      .map-bg {
        background: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: 20px 20px;
        background-color: #f0f0f0;
      }
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #000000;
        cursor: pointer;
        margin-top: -6px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #e2e2e2;
        border-radius: 2px;
      }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen antialiased selection:bg-black selection:text-white">
<!-- Floating Back Button (Synchronized with SCREEN_6) -->
<nav class="fixed top-4 left-4 z-50">
<button class="bg-white border border-outline-variant/30 text-black rounded-full w-12 h-12 flex items-center justify-center hover:bg-gray-100 transition-all active:scale-95 shadow-sm">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</nav>
<main class="min-h-screen max-w-2xl mx-auto px-6 pt-24 pb-40">
<!-- Header Section (Style matched to SCREEN_6) -->
<header class="mb-10">
<h1 class="font-headline font-extrabold text-5xl leading-tight tracking-tighter mb-4 uppercase text-black">设置逻辑条件</h1>
<p class="font-body text-secondary text-base leading-relaxed opacity-80 mb-10">
            为你的决定设置逻辑条件，以此在多格选项组存在时，决定每个选项组该在什么情况下启用。</p>
<!-- Centered Segmented Control (Style matched to SCREEN_6) -->
<div class="flex justify-center mb-8">
<div class="bg-white border border-black/10 rounded-full p-1.5 flex items-center shadow-sm w-full max-w-xs">
<button class="flex-1 px-5 py-3 rounded-full bg-transparent text-secondary text-[11px] font-headline font-extrabold uppercase tracking-[0.2em] transition-all">时间范围</button>
<button class="flex-1 px-5 py-3 rounded-full bg-black text-white text-[11px] font-headline font-extrabold uppercase tracking-[0.2em] transition-all">位置范围</button>
</div>
</div>
</header>
<div class="space-y-6">
<!-- Proximity Priority Explainer -->
<div class="bg-primary p-4 rounded-lg border border-primary">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-white text-xl">info</span>
<p class="text-[11px] font-bold text-white uppercase tracking-wider leading-relaxed">注意：如果所在位置在多个选项组的位置范围内，则会选择距离中心点最近的选项组为目标；若与多个选项组的距离相等，则会在这些选项组内随机选择一个作为抽选目标。</p>
</div>
</div>
<section class="mt-0">
<div class="bg-surface-container-highest/30 p-6 rounded-2xl border border-dashed border-outline-variant/30">
<div class="flex items-center mb-2">
<span class="material-symbols-outlined text-primary text-xl mr-2">error_outline</span>
<h4 class="font-headline font-bold text-sm tracking-tight uppercase">默认组</h4>
</div>
<p class="text-xs text-secondary mb-4 italic">这个逻辑条件的默认选项组，在所有条件都不符合的情况下，会优先选定这个选项组作为抽选目标。</p>
<div class="flex justify-between items-center py-3 px-4 bg-surface rounded-lg border border-outline-variant/10">
<span class="font-medium text-sm">选项组 1</span>
<span class="material-symbols-outlined text-primary">expand_more</span>
</div>
</div>
</section>
<!-- Morning Choices Card -->
<div class="bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm border border-outline-variant/20">
<!-- Map Window -->
<div class="relative h-48 w-full map-bg flex items-center justify-center overflow-hidden rounded-t-2xl">
<!-- Geofence Circle -->
<div class="absolute w-32 h-32 rounded-full bg-black/5 border border-black/20 flex items-center justify-center">
<div class="w-2 h-2 bg-black rounded-full"></div>
</div>
<!-- Mini-label -->
<div class="absolute bottom-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold tracking-widest border border-black/5 uppercase">XXX小区</div>
<button aria-label="Locate me" class="absolute bottom-3 right-3 bg-white/90 backdrop-blur p-1.5 rounded-lg border border-black/10 shadow-sm flex items-center justify-center hover:bg-white active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px] text-black" style='font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;'>my_location</span>
</button>
</div>
<div class="p-5">
<div class="flex justify-between items-start mb-4">
<div class="flex items-center gap-3">
<div>
<h3 class="font-headline font-bold text-lg leading-tight">选项组 1</h3>
</div>
</div>
</div>
<!-- Detection Radius Controls -->
<div class="space-y-3">
<div class="flex justify-between items-end">
<label class="text-[10px] font-bold text-secondary uppercase tracking-widest">范围距离</label>
<span class="text-sm font-bold font-headline">200m</span>
</div>
<input class="w-full accent-black" max="500" min="50" step="10" type="range" value="200"/>
</div>
</div>
</div>
<!-- Evening Choices Card -->
<div class="bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm border border-outline-variant/20">
<!-- Map Window -->
<div class="relative h-48 w-full map-bg flex items-center justify-center overflow-hidden rounded-t-2xl">
<!-- Geofence Circle -->
<div class="absolute w-40 h-40 rounded-full bg-black/5 border border-black/20 border-dashed flex items-center justify-center">
<div class="w-2 h-2 bg-black/40 rounded-full"></div>
</div>
<!-- Mini-label -->
<div class="absolute bottom-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold tracking-widest border border-black/5 uppercase">XXX大厦</div>
<button aria-label="Locate me" class="absolute bottom-3 right-3 bg-white/90 backdrop-blur p-1.5 rounded-lg border border-black/10 shadow-sm flex items-center justify-center hover:bg-white active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px] text-black" style='font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;'>my_location</span>
</button>
</div>
<div class="p-5">
<div class="flex justify-between items-start mb-4">
<div class="flex items-center gap-3">
<div>
<h3 class="font-headline font-bold text-lg leading-tight">选项组 2</h3>
</div>
</div>
</div>
<div class="space-y-3">
<div class="flex justify-between items-end">
<label class="text-[10px] font-bold text-secondary uppercase tracking-widest">范围距离</label>
<span class="text-sm font-bold font-headline">200m</span>
</div>
<input class="w-full accent-black" max="500" min="50" step="10" type="range" value="200"/>
</div>
</div>
</div>
</div>
<!-- Inline Apply Button (Synchronized with bottom style of SCREEN_6) -->
<div class="mt-12 px-2">
<button class="w-full h-16 bg-black text-white font-headline font-extrabold text-lg uppercase tracking-[0.4em] transition-all flex items-center justify-center gap-4 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)] active:scale-[0.98] rounded-2xl">应用逻辑条件</button>
</div>
</main>
<!-- Aesthetic Grain Overlay -->
<div class="fixed inset-0 pointer-events-none z-[100] opacity-[0.03] mix-blend-overlay">
<svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<filter id="noise">
<feturbulence basefrequency="0.65" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
</filter>
<rect filter="url(#noise)" height="100%" width="100%"></rect>
</svg>
</div>
</body></html>
